# Local development infrastructure.
# Production uses managed Postgres/Redis; this file only ever serves dev + CI.
services:
  postgres:
    image: postgres:16.6-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
      # Deterministic collation so index behaviour matches CI and production.
      POSTGRES_INITDB_ARGS: '--locale=C.UTF-8 --encoding=UTF8'
    ports:
      # Deliberately not the default ports. This machine already runs a native
      # PostgreSQL service on 5432 and another Redis on 6379; two listeners on
      # one port make connections land somewhere surprising rather than fail
      # cleanly, which is a miserable thing to debug.
      - '15432:5432'
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data
      - ./packages/db/sql/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d crm']
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      # Surface slow queries during development so we catch N+1 early.
      - -c
      - log_min_duration_statement=200

  redis:
    image: redis:7.4-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      - '16379:6379'
    volumes:
      - crm-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    command: ['redis-server', '--appendonly', 'yes']

  # S3-compatible object storage for import files and generated exports
  # (CLAUDE.md §5.12, ADR-0009). Production uses S3 or R2; the app only ever
  # talks to it through the StorageProvider interface. The bucket is created
  # (and kept private) by `pnpm infra:up`, via packages/storage/scripts.
  minio:
    # Pinned by digest, not a floating tag: RELEASE.2025-09-07T16-13-09Z.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: crm-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: crm_minio
      MINIO_ROOT_PASSWORD: crm_minio_dev_secret
    ports:
      # Off the defaults for the same reason as Postgres and Redis above: this
      # machine may already run one.
      - '19000:9000'
      - '19001:9001'
    volumes:
      - crm-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    command: ['server', '/data', '--console-address', ':9001']

volumes:
  crm-minio-data:
  crm-postgres-data:
  crm-redis-data:
