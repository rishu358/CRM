# gitleaks configuration (CLAUDE.md §5.8, CONTRIBUTING.md).
#
# Scans run in three places, all with this file:
#   * the pre-commit hook (`.githooks/pre-commit`), on the staged copy of each changed file;
#   * CI (`secrets` job in .github/workflows/ci.yml), over the whole history of every ref;
#   * by hand: `gitleaks git --redact` / `gitleaks dir --redact`.
#
# Start from gitleaks' own rules and add nothing that weakens them. A finding is dealt with by
# removing the secret and rotating it, never by loosening a rule. The only exceptions are the
# allowlists below: each lists ONE exact, known-fake value and says why. Not a path (which would hide
# a real secret added to the same file later: tried, and gitleaks' `condition = "AND"` did not narrow
# a path match) and not a line number (which moves whenever a file is edited).

title = "CRM gitleaks configuration"

[extend]
useDefault = true

# Reviewed 2026-10-24. Add an entry only after reading the match; a real secret is removed and
# rotated, not listed here. The value is matched exactly, wherever it appears.

[[allowlists]]
description = "A fixed, made-up value used as a 'good' AUTH_SECRET in a unit test of the production config validator (packages/core/src/config/production.spec.ts). It authenticates nothing anywhere."
regexes = ['''^q8Zr3vXk1LmN7pTc0YbUe5HwJd2GfAoS9iRtVxCz4KuBn6MyPqEl$''']

[[allowlists]]
description = "docs/adr/0017 quotes a SHA-256 digest (token_hash) of a throwaway session from a local development database as evidence. A digest of an expired dev token, not a credential."
regexes = ['''^SwHWhyUqZywZtHMe8pTqOdMm7H8J0e4o$''']
