name: CI

on:
  push:
    # Both names on purpose: this repository's default branch is `master`,
    # and a workflow listening only for `main` would never run on a push.
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '9.15.4'

jobs:
  static:
    name: Lint, types, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # A pull request that changes an endpoint without regenerating the
      # document fails here (ADR-0027). The same assertion runs inside
      # `pnpm test`, so the gate holds even if this job is reordered; it is
      # here as well because a one-second answer beats a ten-minute one.
      # Must stay after `typecheck`, which is what compiles @crm/core to dist.
      - run: pnpm openapi:check

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Integration tests start their own Postgres via Testcontainers, so the
      # Docker daemon on the runner is the only dependency.
      - run: pnpm test

  security:
    name: Tenant isolation and permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # This job must never be made optional or allowed to fail (CLAUDE.md §4).
      - run: pnpm test:security

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://crm_app:crm_app_dev@localhost:5432/crm
      DATABASE_MIGRATION_URL: postgres://crm_migrator:crm_migrator_dev@localhost:5432/crm
      DATABASE_AUTH_URL: postgres://crm_auth:crm_auth_dev@localhost:5432/crm
      DATABASE_WORKER_URL: postgres://crm_worker:crm_worker_dev@localhost:5432/crm
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      API_URL: http://localhost:3001
      WEB_URL: http://localhost:3000
      # Object storage: attachments.spec.ts and import-export.spec.ts exercise
      # presigned upload and download, so the suite needs a real S3 endpoint.
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://localhost:19000
      S3_PUBLIC_ENDPOINT: http://localhost:19000
      S3_BUCKET: crm-files
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: crm_minio
      S3_SECRET_ACCESS_KEY: crm_minio_ci_secret
      S3_FORCE_PATH_STYLE: 'true'
      # Playwright drives the UI far faster than a person, so the default
      # per-IP/user/tenant limits (§5.14) would reject requests mid-suite.
      RATE_LIMIT_WINDOW_SECONDS: '60'
      RATE_LIMIT_MAX_PER_IP: '100000'
      RATE_LIMIT_MAX_PER_USER: '100000'
      RATE_LIMIT_MAX_PER_TENANT: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # MinIO runs as a plain container rather than a `services:` entry
      # because it needs the `server /data` command, and service containers
      # cannot override a command. Same pinned digest as docker-compose.yml.
      - name: Start MinIO and create the bucket
        run: |
          docker run -d --name crm-minio -p 19000:9000 \
            -e MINIO_ROOT_USER=crm_minio \
            -e MINIO_ROOT_PASSWORD=crm_minio_ci_secret \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:19000/minio/health/ready > /dev/null; then
              echo "MinIO ready"; break
            fi
            sleep 2
          done
          docker exec crm-minio mc alias set local http://127.0.0.1:9000 crm_minio crm_minio_ci_secret
          docker exec crm-minio mc mb --ignore-existing local/crm-files
      # The service container starts without our roles, so apply the same
      # bootstrap the local Postgres image runs from its entrypoint.
      - name: Bootstrap database roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d crm -f packages/db/sql/bootstrap/01-extensions-and-roles.sql
      - run: pnpm db:migrate
      - run: pnpm --filter @crm/web exec playwright install --with-deps chromium
      - name: Start API and wait for it
        run: |
          pnpm --filter @crm/api start &
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/v1/health > /dev/null; then
              echo "API ready"; exit 0
            fi
            sleep 2
          done
          echo "API did not become ready" >&2; exit 1
        env:
          NODE_ENV: production
      # Import, export, recycle-bin and data-rights flows are BullMQ jobs, so
      # their specs hang without a worker draining the queue.
      - name: Start the worker
        run: pnpm --filter @crm/worker start &
        env:
          NODE_ENV: production
      # Start the web app on `next start`, not `next dev`. playwright.config.ts
      # sets `reuseExistingServer: true`, so Playwright attaches to this server
      # instead of spawning the dev one, which is how the suite is run locally.
      - name: Start the web app and wait for it
        run: |
          pnpm --filter @crm/web start &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000 > /dev/null; then
              echo "Web ready"; exit 0
            fi
            sleep 2
          done
          echo "Web did not become ready" >&2; exit 1
        env:
          NODE_ENV: production
      - run: pnpm --filter @crm/web exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
